name: Package Manifest Handoff

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact GitHub Release tag, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: true

      - name: Download checksums from the exact GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/microgen-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --dir "$RUNNER_TEMP/microgen-release"
          test -s "$RUNNER_TEMP/microgen-release/checksums.txt"

      - name: Render and validate package metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          go run ./cmd/package-manifests \
            --version "$RELEASE_TAG" \
            --checksums "$RUNNER_TEMP/microgen-release/checksums.txt" \
            --output "$RUNNER_TEMP/microgen-package-manifests"

      - name: Upload metadata for manual review
        uses: actions/upload-artifact@v4
        with:
          name: microgen-package-manifests-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/microgen-package-manifests
          if-no-files-found: error
