name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify dependency policy manifest
        run: go test ./internal/generator -run '^Test(DependencyPolicy|LoadDependencyPolicies|ValidateTargetFrameworkPolicy)' -count=1

      - name: Run tests
        run: go test -race -timeout 2m ./...

      - name: Run vet
        run: go vet ./...

  generated-dotnet-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/dotnet/sdk:8.0.412
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Microgen_{0}_Passw0rd!', github.run_id) }}
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/1433' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true

      - name: Generate single-entity example output
        run: go run ./cmd/microgen generate --config examples/product-service.json --output ./generated-example

      - name: Generate two-entity example output
        run: go run ./cmd/microgen generate --config examples/catalog-service.json --output ./generated-catalog-example

      - name: Generate Record collision regression outputs
        run: |
          go run ./cmd/microgen generate --config examples/record-zero-vo-service.json --output ./generated-record-zero-vo-example
          go run ./cmd/microgen generate --config examples/record-vo-service.json --output ./generated-record-vo-example
          go run ./cmd/microgen generate --config examples/hundred-field-service.json --output ./generated-hundred-field-example

      - name: Generate relationship example output
        run: go run ./cmd/microgen generate --config examples/relationship-service.json --output ./generated-relationship-example

      - name: Build generated single-entity projects
        run: |
          test -f ./generated-example/ProductService/ProductService.sln
          dotnet build ./generated-example/ProductService/ProductService.sln --nologo -warnaserror

      - name: Build generated two-entity projects
        run: |
          test -f ./generated-catalog-example/CatalogService/CatalogService.sln
          dotnet build ./generated-catalog-example/CatalogService/CatalogService.sln --nologo -warnaserror

      - name: Build generated Record collision projects
        run: |
          test -f ./generated-record-zero-vo-example/RecordService/RecordService.sln
          dotnet build ./generated-record-zero-vo-example/RecordService/RecordService.sln --nologo -warnaserror
          test -f ./generated-record-vo-example/RecordService/RecordService.sln
          dotnet build ./generated-record-vo-example/RecordService/RecordService.sln --nologo -warnaserror
          test -f ./generated-hundred-field-example/HundredFieldService/HundredFieldService.sln
          dotnet build ./generated-hundred-field-example/HundredFieldService/HundredFieldService.sln --nologo -warnaserror

      - name: Build generated relationship projects
        run: |
          test -f ./generated-relationship-example/RelationshipService/RelationshipService.sln
          dotnet build ./generated-relationship-example/RelationshipService/RelationshipService.sln --nologo -warnaserror

      - name: Test generated projects with TRX evidence
        shell: bash
        env:
          MICROGEN_TEST_SQLSERVER: Server=sqlserver,1433;User Id=sa;Password=${{ format('Microgen_{0}_Passw0rd!', github.run_id) }};Encrypt=True;TrustServerCertificate=True
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if timeout 2 bash -c '</dev/tcp/sqlserver/1433'; then
              break
            fi
            sleep 5
          done
          test_project() {
            project="$1"
            trx="$2"
            expected="$3"
            dotnet test "$project" --nologo -warnaserror --blame-hang --blame-hang-timeout 90s --logger "trx;LogFileName=$trx"
            trx_path="$(dirname "$project")/TestResults/$trx"
            test -f "$trx_path"
            grep -Eq "total=\"$expected\"" "$trx_path"
          }
          test_service() {
            local tests="$1/tests"
            test_project "$tests/UnitTests/UnitTests.csproj" UnitTests.trx "$2"
            test_project "$tests/IntegrationTests/IntegrationTests.csproj" IntegrationTests.trx "$3"
            test_project "$tests/ArchitectureTests/ArchitectureTests.csproj" ArchitectureTests.trx "$4"
          }
          test_service ./generated-example/ProductService 27 27 4
          test_service ./generated-catalog-example/CatalogService 44 41 4
          test_service ./generated-record-zero-vo-example/RecordService 10 24 4
          test_service ./generated-record-vo-example/RecordService 19 26 4
          test_service ./generated-hundred-field-example/HundredFieldService 10 24 4
          test_service ./generated-relationship-example/RelationshipService 19 34 4
