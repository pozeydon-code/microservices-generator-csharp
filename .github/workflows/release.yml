name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: true

      - name: Install Syft for archive SBOMs
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Build release artifacts locally
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --skip=publish --clean

      - name: Publish GitHub artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --silent "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null

          assets=(
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.spdx.json
          )

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi
